[default]
extend-ignore-re = [
  "\\b[0-9A-Za-z+/]{91}(=|==)?\\b",  # base˚64 strings
  "[0-9a-fA-F]{7,}",                 # git commit hashes and mongo ids
]

# User-facing copy is Spanish. Words that look like English typos but are
# correct Spanish go here, mapped to themselves so typos accepts them as-is.
[default.extend-words]
cliente = "cliente"
